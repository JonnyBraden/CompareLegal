services:
  - type: web
    name: comparelegal
    runtime: static
    buildCommand: python3 build.py
    staticPublishPath: ./public
    domains:
      - comparelegal.com
      - www.comparelegal.com
    envVars:
      # Public values, baked into the site at build time (see README). Leave the first two unset
      # to build the browser-only prototype.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SITE_URL
        value: https://comparelegal.com
      - key: PREMIUM_PRICE_LABEL
        value: £49 per month
      - key: SHOW_SAMPLE_FIRMS
        value: "false"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # If you give Supabase a custom domain, add it to connect-src and img-src.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
